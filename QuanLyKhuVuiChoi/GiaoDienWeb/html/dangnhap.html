<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/dangnhap.css">
    <title>Document</title>
    <script src="/js/dangnhap.js"></script>
</head>

<body>
    <div class="content-vinfast">
        <div id="userVinWonders">
            <div class="card-header tab">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="showTab('login')">Đăng nhập</button>
                    <button class="tab-btn" onclick="showTab('register')">Đăng ký</button>
                </div>
    
                <!-- Form Đăng nhập -->
                <form id="login" class="tab-content">
                    <div class="form-group">
                        <label>Email/Số điện thoại<span> *</span></label>
                        <input type="text" class="form-control" placeholder="yourname@email.com / +84904123456">
                    </div>
    
                    <div class="form-group">
                        <label>Mật khẩu<span> *</span></label>
                        <input type="password" class="form-control" placeholder="Mật khẩu">
                    </div>
    
                    <div class="row remember">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberAccount">
                            <label class="form-check-label" for="rememberAccount">Ghi nhớ tài khoản</label>
                        </div>
    
                        <div class="forgot-password">
                            <a href="#" onclick="showTab('forgot')">Quên mật khẩu?</a>
                        </div>
                    </div>
    
                    <div class="accept-cookies">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="acceptCookies" checked>
                            <label for="acceptCookies">
                                Tôi đồng ý với
                                <a href="#">Điều khoản</a> và
                                <a href="#">Chính sách bảo mật</a>
                            </label>
                        </div>
                    </div>
    
                    <button type="submit" class="btn-active">Đăng nhập</button>
    
                    <div class="login-footer">
                        <p>Chưa có tài khoản? <a href="#" onclick="showTab('register')">Đăng ký ngay</a></p>
                    </div>
                </form>
    
                <!-- Form Đăng ký -->
                <form id="register" class="tab-content hidden">
                    <div class="form-group">
                        <label>Họ và tên<span> *</span></label>
                        <input type="text" class="form-control" placeholder="Nhập họ tên đầy đủ">
                    </div>
    
                    <div class="form-group">
                        <label>Email<span> *</span></label>
                        <input type="email" class="form-control" placeholder="yourname@email.com">
                    </div>
    
                    <div class="form-group">
                        <label>Số điện thoại<span> *</span></label>
                        <input type="text" class="form-control" placeholder="+84904123456">
                    </div>
    
                    <div class="form-group">
                        <label>Mật khẩu<span> *</span></label>
                        <input type="password" class="form-control" placeholder="Tạo mật khẩu">
                    </div>
    
                    <div class="form-group">
                        <label>Nhập lại mật khẩu<span> *</span></label>
                        <input type="password" class="form-control" placeholder="Nhập lại mật khẩu">
                    </div>
    
                    <div class="accept-cookies">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="acceptCookiesRegister" checked>
                            <label for="acceptCookiesRegister">
                                Tôi đồng ý với
                                <a href="#">Điều khoản</a> và
                                <a href="#">Chính sách bảo mật</a>
                            </label>
                        </div>
                    </div>
    
                    <button type="submit" class="btn-active">Đăng ký</button>
    
                    <div class="login-footer">
                        <p>Đã có tài khoản? <a href="#" onclick="showTab('login')">Đăng nhập ngay</a></p>
                    </div>
                </form>
    
                <!-- Form Quên mật khẩu -->
                <form id="forgot" class="tab-content hidden">
                    <div class="form-group">
                        <label>Nhập Email hoặc Số điện thoại<span> *</span></label>
                        <input type="text" class="form-control" placeholder="yourname@email.com / +84904123456">
                    </div>
    
                    <button type="submit" class="btn-active">Gửi mã OTP</button>
    
                    <div class="login-footer">
                        <p><a href="#" onclick="showTab('login')">← Quay lại đăng nhập</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    

</body>

</html>
